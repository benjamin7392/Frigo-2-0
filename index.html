<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a2650">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FRIGO">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="apple-touch-icon" href="icon-180.png">
<title>FRIGO</title>
<script src="config.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Caja de heladería: un color = un significado. Verde entra, rosa sale, amarillo atención, magenta acción. */
:root{
  --bg:#0a2650; --card:#123a6f; --card2:#0e3160; --line:#27528c;
  --ink:#ffffff; --mute:#a9c0dd;
  --mag:#c0307a; --yel:#f3d65a; --teal:#7dbdb7;
  --entra:#3ecf8e; --sale:#ff7a9c; --rojo:#e8455f;
  --disp:"Kaushan Script",cursive;
  --body:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#0a2650}
html,body{overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.45 var(--body);touch-action:manipulation}
main{max-width:540px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 124px}
h2{font-size:16px;font-weight:600;margin:24px 0 10px;letter-spacing:.01em}
h2:first-child{margin-top:14px}
p{margin:0 0 10px}
small{font-size:12.5px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- encabezado ---------- */
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-top:6px}
.brand{font:400 34px/1 var(--disp)}
.logo{display:block;height:56px;width:auto}
.sw{display:block;height:5px;width:74px;border-radius:5px;background:var(--mag);margin:1px 0 0 5px}
.est{text-align:right;font-size:12px;min-width:0}
.est b{display:block;font-weight:600}
.pt{color:var(--teal)}.pt:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--teal);margin-right:5px;vertical-align:1px}
.pa{color:var(--yel)}.pa:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--yel);margin-right:5px;vertical-align:1px}
.who{color:var(--mute);text-decoration:underline;background:none;border:0;padding:2px 0;font-size:12px}

/* ---------- piezas ---------- */
.card{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:14px}
.hero{border-radius:26px;padding:18px 16px;text-align:center;background:linear-gradient(170deg,var(--card),var(--card2));border:1.5px solid var(--line)}
.hero .lab{color:var(--mute);font-size:12px;letter-spacing:.13em;text-transform:uppercase}
.hero .big{font-size:clamp(40px,13vw,54px);font-weight:700;line-height:1.05;margin:4px 0 2px}
.hero .sub{color:var(--mute);font-size:13px}
.pos{color:var(--entra)}.neg{color:var(--sale)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tile{background:rgba(255,255,255,.06);border-radius:16px;padding:10px 12px;text-align:left}
.tile span{display:block;color:var(--mute);font-size:12px}
.tile b{font-size:19px;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:9px 15px;font-size:14px}
.chip.on{background:var(--mag);border-color:var(--mag);font-weight:600}
.chip.ok{background:var(--yel);border-color:var(--yel);color:#0a2650;font-weight:600}
.chip[disabled]{opacity:.35;text-decoration:line-through}
.tile-btn{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:13px 12px;text-align:left;min-width:0}
.tile-btn b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile-btn small{display:block;color:var(--yel)}
.btn{display:block;width:100%;background:var(--mag);border:0;border-radius:999px;padding:14px 20px;font-weight:600;font-size:16px;margin-top:12px}
.btn[disabled]{opacity:.4}
.btn.ghost{background:none;border:1.5px solid var(--line)}
.btn.verde{background:var(--entra);color:#06281c}
.list li .ls{min-width:0}.ls b,.ls small{overflow-wrap:anywhere}
.turno{padding:0;overflow:hidden;margin-bottom:12px}
.turno .cab{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:none;border:0;color:inherit;font:inherit;padding:14px 16px 6px;cursor:pointer}
.turno .cab small{display:block;color:var(--mute);font-size:13px;margin-top:2px}
.turno .pagos{display:flex;flex-wrap:wrap;gap:6px 14px;padding:0 16px 10px;font-size:13px;color:var(--mute)}
.turno .pagos b{color:var(--ink);font-weight:600}
.turno .hint{padding:0 16px 12px}
.vent{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.vent li{display:flex;gap:10px;align-items:flex-start;padding:10px 16px;border-bottom:1px solid var(--line)}
.vent .h{color:var(--mute);font-size:13px;flex:none;width:42px;padding-top:2px}
.vent .q{flex:1;min-width:0;line-height:1.35}
.vent .sab{color:var(--mute);font-size:13px}
.vent .r small{display:block;color:var(--mute);font-size:12px}
.chip.sinst{border-color:var(--rojo);color:var(--rojo)}.chip.sinst.on{color:#fff}
.list li.stk{flex-wrap:wrap}.stk b{white-space:normal}
.stk .acc{flex-basis:100%;display:flex;gap:8px;align-items:center;margin-top:8px}
.stk .acc .lnk{margin-left:auto}
.et{display:block;font-size:11.5px;color:var(--mute);text-align:left;margin-bottom:4px}
.et input,.et select{display:block;margin-top:3px}
.mini.falta{border-color:var(--yel)}
.fab small{display:block;font-size:11px;font-weight:600;margin-top:2px;letter-spacing:.02em}
.btn.grande{font-size:20px;padding:18px;margin:0 0 12px}
.tile-btn.libre{border-style:dashed}
.tile-btn.sinp small{color:var(--mag)}
.lnk{background:none;border:0;color:var(--yel);text-decoration:underline;font-size:13px;padding:2px 0}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.list li{min-width:0;display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:11px 14px}
.list .ls{min-width:0}
.list b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list small{display:block;color:var(--mute)}
.r{text-align:right;white-space:nowrap;flex:none}
.vacio{color:var(--mute);padding:14px 2px}
.hint{color:var(--mute);font-size:13px;margin:8px 0}
label.f{display:block;margin:12px 0 5px;font-size:13px;color:var(--mute)}
input,select,textarea{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 13px}
input.mini{width:76px;padding:7px 9px;font-size:14px}
.barra{height:6px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:6px}
.barra i{display:block;height:100%;border-radius:6px;background:var(--teal)}

/* ---------- semáforo ---------- */
.sem{flex:none;width:14px;height:14px;border-radius:50%}
.s-v{background:var(--entra)}.s-a{background:var(--yel)}.s-r{background:var(--rojo)}
@keyframes lat{0%,100%{opacity:1}50%{opacity:.25}}
.lat{animation:lat 1.1s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.lat{animation:none}}
.urgente{background:var(--rojo);border-radius:18px;padding:12px 14px;font-weight:600;margin-bottom:12px}

/* ---------- navegación ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(18,58,111,.96);backdrop-filter:blur(10px);border-top:1.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav .in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 78px 1fr 1fr;align-items:end;padding:6px max(10px,env(safe-area-inset-left,0px)) 8px}
nav button{background:none;border:0;color:var(--mute);font-size:11.5px;padding:8px 0 6px;border-radius:12px;position:relative}
nav button.on{color:var(--teal);font-weight:600}
nav button.on:after{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:22px;height:3px;border-radius:3px;background:var(--teal)}
.fab{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;background:var(--mag)!important;color:#fff!important;border-radius:22px!important;height:54px;margin:0 6px;font-size:26px!important;font-weight:600;box-shadow:0 6px 18px rgba(192,48,122,.45)}
.pin{position:absolute;top:-6px;right:50%;transform:translateX(30px);min-width:17px;height:17px;border-radius:9px;background:var(--rojo);color:#fff;font-size:10.5px;font-weight:700;line-height:17px;text-align:center;padding:0 4px}

/* ---------- hoja inferior ---------- */
.capa{position:fixed;inset:0;z-index:40;background:rgba(3,12,30,.72);display:flex;align-items:flex-end}
.capa[hidden]{display:none}
.hoja{width:100%;max-width:540px;margin:0 auto;background:var(--bg);border-top:3px solid var(--mag);border-radius:26px 26px 0 0;padding:14px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.agarre{width:42px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--card);border-radius:999px;padding:4px;margin-bottom:14px}
.tabs button{border-radius:999px;padding:10px;font-weight:600;background:none;border:0;color:var(--mute)}
.tabs button.on{background:var(--mag);color:#fff}
.tecla{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tecla button{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:15px 0;font-size:21px;font-weight:600}
.visor{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px;text-align:right;font-size:32px;font-weight:700}

/* ---------- avisos ---------- */
.aviso{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--yel);color:#0a2650;border-radius:16px;padding:11px 14px;font-size:13.5px;margin-bottom:10px}
.aviso button{flex:none;background:#0a2650;color:#fff;border:0;border-radius:999px;padding:8px 14px;font-weight:600;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);z-index:50;background:var(--yel);color:#0a2650;border-radius:999px;padding:10px 16px;font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:12px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:92vw}
.toast.ver{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:#0a2650;color:#fff;border:0;border-radius:999px;padding:7px 13px;font-weight:600;font-size:13px;flex:none}
.card.ficha{border-color:var(--entra);margin-bottom:14px}
.card.viaje{border-color:var(--yel)}
.card.viaje .eti{color:var(--yel)}
.card.viaje.encurso{border-color:var(--mag)}
.card.viaje.encurso .eti{color:var(--mag)}
.gps{text-transform:none;letter-spacing:0;font-size:11px;color:var(--entra);margin-left:6px}
.gps.apagado{color:var(--mute)}
.card.ficha.dentro{border-color:var(--teal)}
.eti{display:block;font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--entra);font-weight:600}
.card.ficha.dentro .eti{color:var(--teal)}
.card.ojo{border-color:var(--yel)}
.card.ojo b{color:var(--yel)}
code{background:rgba(0,0,0,.3);border-radius:6px;padding:1px 5px;font-size:13.5px}
.pant{text-align:center;padding:40px 10px}
.pant ol{text-align:left;max-width:300px;margin:16px auto;padding-left:20px}
.pant li{margin:9px 0}
svg{display:block;max-width:100%}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--yel);font-weight:600;white-space:nowrap}
td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.pie{color:var(--mute);font-size:11.5px;text-align:center;margin-top:22px}
</style>

<body>
<main>
  <header>
    <img class="logo" src="logo.png" alt="Frigo Shop · Heladería" width="104" height="70">
    <div class="est" id="est"></div>
  </header>
  <div id="avisos"></div>
  <div id="app"><p class="vacio">Abriendo FRIGO…</p></div>
  <p class="pie" id="pie"></p>
</main>

<nav id="nav" hidden><div class="in">
  <button data-v="hoy" onclick="ir('hoy')">Hoy</button>
  <button data-v="pedidos" onclick="ir('pedidos')">Pedidos<span class="pin" id="pinP" hidden></span></button>
  <button class="fab" onclick="abrirHoja('venta')" aria-label="Anotar una venta">+<small>Vender</small></button>
  <button data-v="faltan" onclick="ir('faltan')">Stock<span class="pin" id="pinF" hidden></span></button>
  <button data-v="mas" onclick="ir('mas')">Más</button>
</div></nav>

<div class="capa" id="capa" hidden onclick="if(event.target===this)cerrarHoja()"><div class="hoja" id="hoja"></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
"use strict";
/* ============================================================
   FRIGO — caja, stock y resultados de la heladería.
   Un solo archivo. Funciona instalado y sin internet.
   El dinero se guarda en centavos enteros: nunca en decimales.
   ============================================================ */

const VERSION = "3.4";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const pad = n => String(n).padStart(2, "0");

/* ---------- fechas ----------
   El día del negocio termina a las 6 de la mañana: lo que se vende el sábado a la 1 de la
   madrugada es del sábado, y el cierre de caja de esa noche lo incluye. */
const CORTE_HORAS = 6;
const diaDe = ts => { const d = new Date(ts); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); };
const HOY = () => diaDe(Date.now() - CORTE_HORAS * 3600000);
const correrDia = (dia, n) => { const [a,m,d] = dia.split("-").map(Number); const x = new Date(a, m-1, d+n); return diaDe(x); };
const lindo = dia => { const [a,m,d] = dia.split("-").map(Number); const x = new Date(a, m-1, d);
  return ["dom","lun","mar","mié","jue","vie","sáb"][x.getDay()] + " " + d + "/" + m; };
const hora = ts => new Date(ts).toLocaleTimeString("es-AR", { hour:"2-digit", minute:"2-digit", hour12:false });

/* ---------- plata ---------- */
const cent = pesos => Math.round((parseFloat(String(pesos).replace(",", ".")) || 0) * 100);
const pesos = c => (c || 0) / 100;
const $$ = c => { const v = Math.round(pesos(c)); return (v < 0 ? "−$" : "$") + Math.abs(v).toLocaleString("es-AR"); };
const signo = c => (c < 0 ? "−$" : "+$") + Math.abs(Math.round(pesos(c))).toLocaleString("es-AR");
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return Number.isFinite(n) ? n : NaN; };
const suma = (a, k) => a.reduce((t, x) => t + (+x[k] || 0), 0);

/* ============================================================
   DEPÓSITO DE DATOS
   Tres modos, una sola interfaz: ver / guardar / borrar.
   - nube   : base compartida de Claude (varios celulares, en vivo)
   - cloud  : Firestore propio, si config.js trae las claves
   - local  : IndexedDB, solo este celular, 100% sin internet
   ============================================================ */
const COLS = ["faltantes", "productos", "sabores", "ventas", "gastos", "cierres", "ajustes", "fichajes", "viajes", "pedidos"];

function depositoLocal() {
  const cache = {}, oyentes = {};
  COLS.forEach(c => { cache[c] = []; oyentes[c] = []; });
  let bd = null;

  const abrir = () => new Promise((ok, mal) => {
    const p = indexedDB.open("frigo", 2);
    p.onupgradeneeded = () => { const d = p.result; COLS.forEach(c => { if (!d.objectStoreNames.contains(c)) d.createObjectStore(c, { keyPath: "id" }); }); };
    p.onsuccess = () => ok(p.result);
    p.onerror = () => mal(p.error);
  });
  const tx = (col, modo) => bd.transaction(col, modo).objectStore(col);
  const avisar = col => oyentes[col].forEach(f => f(cache[col].slice()));

  return {
    modo: "local", enVivo: true, pendientes: 0,
    async iniciar() {
      bd = await abrir();
      await Promise.all(COLS.map(col => new Promise(ok => {
        const q = tx(col, "readonly").getAll();
        q.onsuccess = () => { cache[col] = q.result || []; ok(); };
        q.onerror = () => ok();
      })));
    },
    ver(col, cb) { oyentes[col].push(cb); cb(cache[col].slice()); return () => { oyentes[col] = oyentes[col].filter(f => f !== cb); }; },
    nuevoId() { return "x" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); },
    async guardar(col, id, datos) {
      const doc = { ...datos, id };
      const i = cache[col].findIndex(x => x.id === id);
      if (i >= 0) cache[col][i] = { ...cache[col][i], ...doc }; else cache[col].push(doc);
      avisar(col);
      await new Promise(ok => { const q = tx(col, "readwrite").put(cache[col].find(x => x.id === id)); q.onsuccess = ok; q.onerror = ok; });
    },
    async borrar(col, id) {
      cache[col] = cache[col].filter(x => x.id !== id); avisar(col);
      await new Promise(ok => { const q = tx(col, "readwrite").delete(id); q.onsuccess = ok; q.onerror = ok; });
    },
  };
}

function depositoClaude(db) {
  return {
    modo: "nube", enVivo: false, pendientes: 0,
    async iniciar() {},
    ver(col, cb) {
      return db.collection(col).onSnapshot(
        s => { this.enVivo = !s.metadata.fromCache; cb(s.docs.map(d => ({ ...d.data(), id: d.id }))); },
        () => aviso("No se pudo leer " + col + ". Revisá tu conexión.")
      );
    },
    nuevoId() { return "x" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); },
    guardar(col, id, datos) { return db.doc(col + "/" + id).set({ ...datos, id }, { merge: true }); },
    borrar(col, id) { return db.doc(col + "/" + id).delete(); },
  };
}

// Cuánto pasado se escucha en vivo. Cada documento escuchado cuenta como lectura cada vez
// que un celular abre la app: por eso en vivo va solo lo reciente, y la historia larga
// (reportes, planilla, días viejos) se pide una sola vez cuando alguien la abre.
const VIVO = 3;
const VENTANA = { ventas: VIVO, gastos: VIVO, pedidos: VIVO, fichajes: 40, viajes: 40, cierres: 400 };

function depositoFirestore(auth, bd) {
  let pend = 0;
  return {
    modo: "cloud", enVivo: false, get pendientes() { return pend; },
    async iniciar() { try { await bd.enablePersistence(); } catch (e) {} },
    ver(col, cb) {
      let q = bd.collection(col);
      if (VENTANA[col]) q = q.where("dia", ">=", correrDia(HOY(), -VENTANA[col]));
      return q.onSnapshot({ includeMetadataChanges: true }, s => {
        this.enVivo = !s.metadata.fromCache;
        if (col === "ventas") pend = s.docs.filter(d => d.metadata.hasPendingWrites).length;
        cb(s.docs.map(d => ({ ...d.data(), id: d.id })));
      }, e => { if (e && e.code === "permission-denied") aviso("Falta publicar las reglas de seguridad: mirá PASOS-NUBE.md, paso 4."); });
    },
    nuevoId() { return bd.collection("ventas").doc().id; },
    async traer(col, desde, hasta) {
      const s = await bd.collection(col).where("dia", ">=", desde).where("dia", "<", hasta).get();
      return s.docs.map(d => ({ ...d.data(), id: d.id }));
    },
    // Suma o resta sin pisar lo que haya cargado otro celular al mismo tiempo.
    sumar(col, id, campo, n, extra) {
      bd.doc(col + "/" + id).set({ ...(extra || {}), [campo]: firebase.firestore.FieldValue.increment(n) }, { merge: true }).catch(fallo);
      return Promise.resolve();
    },
    // Firestore anota el cambio en este celular al instante y lo sube cuando puede (también sin señal).
    // No se espera la confirmación del servidor: si no, la pantalla queda trabada hasta que responde.
    // Si el servidor lo rechaza, Firestore lo deshace solo y se avisa.
    guardar(col, id, datos) { bd.doc(col + "/" + id).set({ ...datos, id }, { merge: true }).catch(fallo); return Promise.resolve(); },

/* ============================================================
   GRÁFICO: una sola serie, barras finas, punta redondeada.
   El texto usa color de texto; la barra lleva el color.
   ============================================================ */
function barras(datos, { color = "var(--entra)", negativo = "var(--sale)", alto = 118, fmt = $$ } = {}) {
  if (!datos.length || datos.every(d => !d.v)) return `<p class="vacio">Sin datos todavía.</p>`;
  const arriba = Math.max(0, ...datos.map(d => d.v));
  const abajo  = Math.min(0, ...datos.map(d => d.v));
  const rango = (arriba - abajo) || 1;
  const n = datos.length, W = 320, H = alto, pieLab = 14, tope = 14;
  const util = H - pieLab - tope;                  // alto dibujable
  const cero = tope + (arriba / rango) * util;     // el cero puede quedar a media altura
  const paso = W / n, ancho = Math.max(4, Math.min(26, paso - 4));
  const pico = datos.reduce((a, b) => (Math.abs(b.v) > Math.abs(a.v) ? b : a), datos[0]);
  const cuerpo = datos.map((d, i) => {
    const alt = d.v ? Math.max(2.5, Math.abs(d.v) / rango * util) : 0;
    const x = i * paso + (paso - ancho) / 2;
    const y = d.v >= 0 ? cero - alt : cero;
    const esPico = d === pico && d.v !== 0;
    const ey = d.v >= 0 ? y - 4 : y + alt + 9;
    return `<g><title>${esc(d.k)}: ${esc(fmt(d.v))}</title>`
      + (alt ? `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${ancho.toFixed(1)}" height="${alt.toFixed(1)}" rx="3" fill="${d.v < 0 ? negativo : color}" opacity="${esPico ? 1 : .6}"/>` : "")
      + (esPico ? `<text x="${(x + ancho / 2).toFixed(1)}" y="${Math.min(H - 16, Math.max(9, ey)).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="600" fill="var(--ink)">${esc(fmt(d.v))}</text>` : "")
      + `<text x="${(x + ancho / 2).toFixed(1)}" y="${H - 3}" text-anchor="middle" font-size="9" fill="var(--mute)">${esc(d.k)}</text></g>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="Barras del período; tocá una barra para ver el valor">
    <line x1="0" y1="${cero.toFixed(1)}" x2="${W}" y2="${cero.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>${cuerpo}</svg>`;
}

const ESTADOS = { nuevo: "Entró recién", haciendo: "Lo están preparando", listo: "Listo para entregar" };
// Solo los de hoy y ayer: un pedido abandonado hace días no debe quedar colgado para siempre.
const pendientes = () => PD.filter(p => p.estado !== "entregado" && p.estado !== "cancelado" && p.dia >= correrDia(HOY(), -1))
  .sort((a, b) => a.ts - b.ts);
const nuevos = () => PD.filter(p => p.estado === "nuevo").length;
// Timbre de pedido nuevo: suena y vibra solo por los que llegan con la app abierta (no por los que ya estaban).
let pedidosVistos = null, sonido = null;
function timbre() {
  try {
    sonido = sonido || new (window.AudioContext || window.webkitAudioContext)();
    if (sonido.state === "suspended") sonido.resume();
    [0, 0.18, 0.36].forEach((t, i) => {
      const o = sonido.createOscillator(), g = sonido.createGain();
      o.type = "sine"; o.frequency.value = [880, 1175, 1568][i];
      g.gain.setValueAtTime(0.0001, sonido.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.35, sonido.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, sonido.currentTime + t + 0.3);
      o.connect(g).connect(sonido.destination); o.start(sonido.currentTime + t); o.stop(sonido.currentTime + t + 0.32);
    });
  } catch (e) {}
  try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
}
// El navegador solo deja sonar después de un toque: se "despierta" el audio con el primero.
addEventListener("pointerdown", () => { try { sonido = sonido || new (window.AudioContext || window.webkitAudioContext)(); sonido.resume(); } catch (e) {} }, { once: true });
function avisarPedidosNuevos(lista) {
  const ids = lista.filter(p => p.estado === "nuevo").map(p => p.id);
  if (pedidosVistos === null) { pedidosVistos = new Set(ids); return; }
  const llegaron = ids.filter(id => !pedidosVistos.has(id));
  ids.forEach(id => pedidosVistos.add(id));
  if (!llegaron.length || !puedeVender()) return;
  timbre();
  const p = lista.find(x => x.id === llegaron[0]);
  notificar("Pedido nuevo" + (p && p.nombre ? " de " + String(p.nombre).slice(0, 30) : ""), "Ver", () => ir("pedidos"));
}

const estadoPedido = (id, e) => D.guardar("pedidos", id, { estado: e }).catch(fallo);

// Entregar un pedido lo convierte en venta, igual que una del mostrador.
// Precio, costo y kilos salen SIEMPRE del menú del local, nunca de lo que mandó el cliente:
// la página pública la puede tocar cualquiera.
function itemsDelLocal(p) {
  return (Array.isArray(p.items) ? p.items : []).slice(0, 20).map(i => {
    const prod = P.find(x => x.nombre === i.n);
    const sab = (Array.isArray(i.s) ? i.s : []).filter(n => MENU.includes(n)).slice(0, 6);
    return prod ? { n: prod.nombre, p: prod.precio || 0, c: prod.costo || 0, bal: baldesDe(prod), s: sab }
                : { n: String(i.n || "Producto").slice(0, 60), p: 0, c: 0, bal: 0, s: sab, desconocido: true };
  });
}
async function entregarPedido(id, formaPago) {
  const p = PD.find(x => x.id === id);
  if (!p || p.estado === "entregado" || entregando.has(id)) return;
  const items = itemsDelLocal(p), total = suma(items, "p");
  if (items.some(i => i.desconocido)) { notificar("Hay un producto del pedido que ya no está en el menú: cobralo desde Vender."); return; }
  entregando.add(id); pintar();
  try {
    // El id de la venta sale del pedido: aunque dos celulares lo toquen a la vez, queda una sola.
    await D.guardar("ventas", "ped_" + id, {
      dia: HOY(), ts: Date.now(), por: quien, pago: formaPago, pedido: String(p.numero || ""), turno: (miFichaje() || {}).id || null,
      items: items.map(({ desconocido, ...i }) => i), total, costo: suma(items, "c"),
    });
    const bajas = {};
    items.forEach(i => {
      if (!i.bal || !i.s.length) return;
      const porSabor = i.bal / i.s.length;
      i.s.forEach(n => { const k = MENU.indexOf(n); if (k >= 0) bajas[k] = (bajas[k] || 0) + porSabor; });
    });
    for (const k of Object.keys(bajas)) await reponer(+k, -bajas[k], true);
    await D.guardar("pedidos", id, { estado: "entregado", pago: formaPago });
    notificar("Pedido " + p.numero + " cobrado: " + $$(total) + (total !== p.total ? " (precio del menú actual)" : ""));
  } catch (e) { fallo(e); entregando.delete(id); }
  pintar();
}

/* ---------- Historial de ventas por turno ----------
   Un turno es el fichaje de quien cobró (Llegué → Me voy). Si cobró sin fichar, se agrupa por persona. */
function turnoDe(v) {
  const f = (v.turno && FI.find(x => x.id === v.turno))
    || FI.find(x => x.persona === v.por && x.entrada <= v.ts && (!x.salida || x.salida >= v.ts));
  return f ? { k: f.id, quien: f.persona, desde: f.entrada, hasta: f.salida }
           : { k: "p:" + (v.por || "?"), quien: v.por || "Sin nombre", desde: null, hasta: null };
}

    grupos.get(t.k).v.push(v);
  });
  const lista = [...grupos.values()].sort((a, b) => (a.desde || a.v[0].ts) - (b.desde || b.v[0].ts));
  const pagosDe = vs => pagosEn(vs).map(p => [p, suma(vs.filter(x => x.pago === p), "total")]).filter(x => x[1]);
  return `
  <div class="row" style="justify-content:space-between;align-items:center">

  <h2>Ventas por turno</h2>
  ${lista.length ? lista.map(g => {
    const abierto = turnoAbierto === g.k || lista.length === 1;
    return `<div class="card turno">
      <button class="cab" onclick="turnoAbierto=${abierto && lista.length > 1 ? "null" : `'${g.k}'`};pintar()">

function corregirStock(i) {

/* ---------- Lista de compras (solo el dueño) ----------
   Cuánto se vendió de cada sabor en las últimas 2 semanas, cuánto queda, y cuánto pedir para
   llegar a la próxima entrega con 1 balde de colchón. Las cantidades se pueden tocar a mano. */
const DIAS_CONSUMO = 14;
let compraAjuste = {};
function consumoDiario() {
  const desde = correrDia(HOY(), -DIAS_CONSUMO), c = MENU.map(() => 0), dias = new Set();
  V.filter(v => v.dia >= desde).forEach(v => {
    dias.add(v.dia);
    (v.items || []).forEach(it => {
      const b = baldesItem(it), sab = it.s || [];
      if (!b || !sab.length) return;
      sab.forEach(n => { const k = MENU.indexOf(n); if (k >= 0) c[k] += b / sab.length; });
    });
  });
  const n = Math.max(1, dias.size);
  return { porDia: c.map(x => x / n), dias: dias.size };
}
function sugerencias() {
  const cada = +ajuste("cadaCuanto", 7) || 7, { porDia, dias } = consumoDiario();
  const filas = MENU.map((n, i) => {
    const b = baldes(i), uso = porDia[i];
    const auto = uso > 0 || cargado(i) ? Math.max(0, Math.ceil(uso * cada + POCO - b - 1e-9)) : 0;
    const cant = compraAjuste[i] != null ? compraAjuste[i] : auto;
    return { n, i, b, uso, auto, cant };
  });
  return { filas, cada, dias };
}
function cambiarCompra(i, d) {
  const f = sugerencias().filas[i];
  compraAjuste[i] = Math.max(0, f.cant + d); pintar();
}
function textoCompra() {
  const { filas } = sugerencias(), pedir = filas.filter(f => f.cant > 0);
  const otros = FA.map(x => x.nombre).concat(S.filter(x => x.tipo === "insumo").map(x => x.nombre));
  let t = "Pedido Frigo Shop — " + lindo(HOY()) + "\n";
  if (pedir.length) t += "\nHelado (baldes de 10 L):\n" + pedir.map(f => "• " + f.n + ": " + f.cant).join("\n") + "\n";
  if (otros.length) t += "\nOtras cosas:\n" + otros.map(x => "• " + x).join("\n") + "\n";
  return t;
}
function compartirCompra(como) {
  const t = textoCompra();
  if (como === "wa") { window.open("https://wa.me/?text=" + encodeURIComponent(t), "_blank"); return; }
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(
    () => notificar("Lista copiada. Pegala donde quieras."),
    () => notificar("No se pudo copiar"));
}

    y lo que queda, para que te alcance hasta la próxima entrega con 1 balde de sobra. Tocá − o + para cambiar.</p>

function vRep() {

  const previos = Array.from({ length: n }, (_, i) => correrDia(HOY(), -(2 * n - 1 - i)));
  const tot = ds => ds.reduce((a, d) => { const r = resumen(d); return { ventas: a.ventas + r.ventas, gastos: a.gastos + r.gastos, ganancia: a.ganancia + r.ganancia, n: a.n + r.v.length }; }, { ventas: 0, gastos: 0, ganancia: 0, n: 0 });
  const act = tot(dias), ant = tot(previos);
  const varia = ant.ventas ? Math.round(((act.ventas - ant.ventas) / ant.ventas) * 100) : null;
  const serie = dias.map(d => ({ k: n <= 14 ? d.slice(8) : "", v: resumen(d).ganancia }));

  const ventasPeriodo = V.filter(x => dias.includes(x.dia));
  const porProd = {};
  ventasPeriodo.forEach(v => (v.items || []).forEach(i => {
    const a = porProd[i.n] = porProd[i.n] || { u: 0, t: 0, c: 0 };
    a.u++; a.t += i.p || 0; a.c += i.c || 0;
  }));
  const ranking = Object.entries(porProd).sort((a, b) => b[1].t - a[1].t);
  const porSabor = {};
  ventasPeriodo.forEach(v => (v.items || []).forEach(i => (i.s || []).forEach(s => porSabor[s] = (porSabor[s] || 0) + 1)));
  const topSabor = Object.entries(porSabor).sort((a, b) => b[1] - a[1]).slice(0, 8);

  return `<h2>Reportes</h2>
  <div class="row">${[[7, "7 días"], [30, "30 días"], [90, "90 días"]].map(([v, t]) => `

    <span class="sub">${act.n} venta${act.n === 1 ? "" : "s"}${varia !== null ? ` · ${varia >= 0 ? "▲" : "▼"} ${Math.abs(varia)}% vs. los ${n} días anteriores` : ""}</span>
    <div class="duo">
      <div class="tile"><span>Ventas</span><b class="tnum pos">${$$(act.ventas)}</b></div>

  <h2>Lo que más deja</h2>
  ${ranking.length ? `<div class="scroll"><table>
    <tr><th>Producto</th><th class="n">Unid.</th><th class="n">Vendido</th><th class="n">Margen</th></tr>
    ${ranking.slice(0, 12).map(([nom, a]) => `<tr><td>${esc(nom)}</td><td class="n">${a.u}</td>
      <td class="n">${$$(a.t)}</td><td class="n ${a.t - a.c < 0 ? "neg" : "pos"}">${$$(a.t - a.c)}</td></tr>`).join("")}
  </table></div>` : `<p class="vacio">Sin ventas en el período.</p>`}

  <h2>Sabores más pedidos</h2>

    <li><div class="ls" style="width:100%"><b>${esc(s)}</b><div class="barra"><i style="width:${Math.round((c / maxSab) * 100)}%"></i></div></div>
    <b class="tnum r">${c}</b></li>`).join("")}</ul>` : `<p class="vacio">Todavía no hay datos de sabores.</p>`}`;

function difTurnoAhora(contado) {
  const previo = cierresTurno(dia).slice(-1)[0];

  return { acum, dif: acum - (previo ? previo.difAcum || 0 : 0) };
}
function pintarDifT() {
  const c = $("#contadoT"), out = $("#difT"); if (!c || !out) return;
  if (c.value === "") { out.innerHTML = ""; return; }
  const { dif } = difTurnoAhora(cent(c.value));
  out.innerHTML = dif === 0 ? `<b class="pos">Cuadra justo.</b>`
    : `<b class="${dif < 0 ? "neg" : "pos"}">${dif < 0 ? "Faltan" : "Sobran"} ${$$(Math.abs(dif))} en tu turno.</b>`;
}
let cerrandoTurno = false;
async function cerrarTurno() {
  const f = miFichaje(), c = $("#contadoT");
  if (!f || !c) return;
  if (c.value === "") { notificar("Contá la caja y escribí cuánto hay"); return; }
  if (cerrandoTurno || cierreTurnoDe(f.id)) return;
  cerrandoTurno = true;
  const contado = cent(c.value), ahora = Date.now(), { acum, dif } = difTurnoAhora(contado), vs = ventasDelTurno(f);
  try {
    await D.guardar("cierres", "t_" + f.id, {
      tipo: "turno", dia, ts: ahora, por: quien, turno: f.id, contado, esperado: esperadoHasta(dia, ahora), difAcum: acum, dif,
      efectivo: suma(vs.filter(x => x.pago === "Efectivo"), "total"), transferencia: suma(vs.filter(x => x.pago !== "Efectivo"), "total"),
    });
    c.value = ""; c.blur();
    notificar(dif === 0 ? "Turno cerrado: cuadró." : "Turno cerrado: " + (dif < 0 ? "faltan " : "sobran ") + $$(Math.abs(dif)) + ".");
    await salir();
    ir("hoy");
  } catch (e) { fallo(e); }
  cerrandoTurno = false;
}

/* ============================================================
   FORMULARIO EXPRÉS: una venta en tres toques
   ============================================================ */
function pintarHoja() {
  const capa = $("#capa");
  if (!hojaTab) { capa.hidden = true; return; }
  capa.hidden = false;
  $("#hoja").innerHTML = `<div class="agarre"></div>
    <div class="tabs">
      <button class="${hojaTab === "venta" ? "on" : ""}" onclick="hojaTab='venta';pintarHoja()">Venta</button>
      <button class="${hojaTab === "gasto" ? "on" : ""}" onclick="hojaTab='gasto';pintarHoja()">Gasto</button>
    </div>` + (hojaTab === "venta" ? hojaVenta() : hojaGasto());
}

function hojaVenta() {
  const teclas = `<div class="tecla">${["1","2","3","4","5","6","7","8","9","00","0","←"].map(k => `<button onclick="tocarTecla('${k}')">${k}</button>`).join("")}</div>`;
  if (precioPara) {
    const t = cent(teclado || "0"), libre = precioPara === "libre";
    return `<b>${libre ? "Venta por importe" : esc(precioPara.nombre)}</b>
      <p class="hint" style="margin:4px 0 10px">${libre ? "Escribí cuánto cobrás." : "Todavía no tiene precio. Escribí cuánto cobrás" + (esDueno() ? " y queda guardado como su precio." : ".")}</p>
      <div class="visor tnum" id="visor">${$$(t)}</div>${teclas}
      <button class="btn verde" id="bp" onclick="confirmarImporte()" ${t > 0 ? "" : "disabled"}>${t > 0 ? "Agregar " + $$(t) : "Escribí el importe"}</button>
      <button class="btn ghost" onclick="precioPara=null;teclado='';pintarHoja()">Volver</button>`;
  }
  if (!P.length && !ticket.length) return `<p class="hint">Todavía no hay productos cargados, pero podés anotar la venta igual.</p>
    <button class="btn verde grande" onclick="precioPara='libre';teclado='';pintarHoja()">Anotar venta por importe</button>
    ${esDueno() ? `<button class="btn ghost" onclick="cerrarHoja();ir('prod')">Cargar el menú y los precios</button>` : ""}`;

  if (eligiendo) {
    const ag = agotados();
    return `<b>${esc(eligiendo.nombre)}</b>
      <p class="hint" style="margin:4px 0 10px">Elegí hasta ${eligiendo.mx} sabor${eligiendo.mx > 1 ? "es" : ""}.${ag.length ? " Los marcados en rojo figuran sin stock." : ""}</p>
      <div class="row">${MENU.map((s, i) => `
        <button class="chip${elegidos.includes(s) ? " on" : ""}${ag.includes(s) ? " sinst" : ""}" onclick="tocarSabor(${i})">${esc(s)}${ag.includes(s) ? " · sin stock" : ""}</button>`).join("")}</div>
      <button class="btn" onclick="sumarAlTicket()" ${elegidos.length ? "" : "disabled"}>
        ${elegidos.length ? `Agregar (${elegidos.length})` : "Elegí al menos un sabor"}</button>
      <button class="btn ghost" onclick="eligiendo=null;elegidos=[];pintarHoja()">Volver</button>`;
  }

  const lineas = LINEAS.filter(l => P.some(p => p.linea === l));
  if (lineas.length && !lineas.includes(linea)) linea = lineas[0];
  const total = suma(ticket, "p");
  return `
    <div class="row">${lineas.map(l => `<button class="chip${l === linea ? " on" : ""}" onclick="linea='${esc(l)}';pintarHoja()">${esc(l)}</button>`).join("")}</div>
    <div class="grid2" style="margin-top:10px">${P.filter(p => p.linea === linea).map(p => `
      <button class="tile-btn${p.precio ? "" : " sinp"}" onclick="tocarProducto('${p.id}')">
        <b>${esc(p.nombre.replace(p.linea + " ", ""))}</b><small class="tnum">${p.precio ? $$(p.precio) : "Poné el precio"}</small></button>`).join("")}
      <button class="tile-btn libre" onclick="precioPara='libre';teclado='';pintarHoja()"><b>Otro importe</b><small>Escribís el monto</small></button></div>
    ${ticket.length ? `
      <h2>Este ticket</h2>
      <ul class="list">${ticket.map((t, i) => `
        <li><div class="ls"><b>${esc(t.n)}</b>${t.s.length ? `<small>${esc(t.s.join(", "))}</small>` : ""}</div>
        <div class="r"><b class="tnum">${$$(t.p)}</b><br><button class="lnk" onclick="ticket.splice(${i},1);pintarHoja()">Quitar</button></div></li>`).join("")}</ul>
      <div class="row" style="margin-top:12px">${PAGOS.map(p => `
        <button class="chip${p === pago ? " on" : ""}" onclick="pago='${p}';pintarHoja()">${p}</button>`).join("")}</div>
      <button class="btn verde" onclick="cobrar()" ${cobrando ? "disabled" : ""}>Cobrar ${$$(total)}</button>`
      : `<p class="hint">Tocá un producto para armar el ticket.</p>`}`;
}

function hojaGasto() {
  const t = cent(teclado || "0");
  return `
    <div class="visor tnum" id="visor">${$$(t)}</div>
    <div class="tecla">
      ${["1","2","3","4","5","6","7","8","9","00","0","←"].map(k => `<button onclick="tocarTecla('${k}')">${k}</button>`).join("")}
    </div>
    <label class="f" for="gc">¿En qué se gastó?</label>
    <input id="gc" value="${esc(gastoTxt)}" oninput="gastoTxt=this.value;refrescarGasto()" placeholder="Ej. 20 litros de leche">
    <label class="f">Rubro</label>
    <div class="row">${RUBROS.map(r => `<button class="chip${r === gastoRubro ? " on" : ""}" onclick="gastoRubro='${r}';pintarHoja()">${r}</button>`).join("")}</div>
    ${gastoRubro === "Retiro" ? `<p class="hint">Un retiro es plata que sacás de la caja: se descuenta del efectivo, pero no cuenta como gasto del negocio.</p>` : `
    <label class="f">¿Salió de la caja?</label>
    <div class="row">
      <button class="chip${gastoCaja ? " on" : ""}" onclick="gastoCaja=true;pintarHoja()">Sí, de la caja</button>
      <button class="chip${gastoCaja ? "" : " on"}" onclick="gastoCaja=false;pintarHoja()">No, se pagó aparte</button>
    </div>`}
    <button class="btn" id="bg" onclick="registrarGasto()" ${t > 0 && gastoTxt.trim() ? "" : "disabled"}>
      ${t > 0 && gastoTxt.trim() ? `Registrar gasto de ${$$(t)}` : "Escribí el monto y el concepto"}</button>`;
}

/* ============================================================
   ACCIONES
   ============================================================ */
function tocarProducto(id) {
  const p = P.find(x => x.id === id); if (!p) return;
  if (!p.precio) { precioPara = p; teclado = ""; pintarHoja(); return; }
  if (!p.mx) { ticket.push({ n: p.nombre, p: p.precio, c: p.costo || 0, bal: baldesDe(p), s: [] }); pintarHoja(); return; }
  eligiendo = p; elegidos = []; pintarHoja();
}
function tocarSabor(i) {
  const s = MENU[i], k = elegidos.indexOf(s);
  if (k < 0 && agotados().includes(s)) notificar(s + " figura sin stock. Si hay, avisale al dueño para que lo corrija.");
  if (k >= 0) elegidos.splice(k, 1);
  else { if (elegidos.length >= eligiendo.mx) elegidos.shift(); elegidos.push(s); }
  pintarHoja();
}
function sumarAlTicket() {
  ticket.push({ n: eligiendo.nombre, p: eligiendo.precio, c: eligiendo.costo || 0, bal: baldesDe(eligiendo), s: elegidos.slice() });
  eligiendo = null; elegidos = []; pintarHoja();
}
function confirmarImporte() {
  const t = cent(teclado || "0"); if (!(t > 0)) return;
  const p = precioPara; precioPara = null; teclado = "";
  if (p === "libre") { ticket.push({ n: "Venta por importe", p: t, c: 0, bal: 0, s: [] }); pintarHoja(); return; }
  if (esDueno()) D.guardar("productos", p.id, { precio: t }).catch(() => {});
  const prod = { ...p, precio: t };
  if (!prod.mx) { ticket.push({ n: prod.nombre, p: t, c: prod.costo || 0, bal: baldesDe(prod), s: [] }); pintarHoja(); return; }
  eligiendo = prod; elegidos = []; pintarHoja();
}
function tocarTecla(k) {
  if (k === "←") teclado = teclado.slice(0, -1);
  else if (teclado.length < 9) teclado += k;
  refrescarGasto();
}
// Refresca solo el visor y el botón: escribir el concepto no pierde el foco.
function refrescarGasto() {
  const t = cent(teclado || "0"), v = $("#visor"), b = $("#bg"), bp = $("#bp");
  if (v) v.textContent = $$(t);
  if (bp) { bp.disabled = !(t > 0); bp.textContent = t > 0 ? "Agregar " + $$(t) : "Escribí el importe"; }
  if (b) {
    const listo = t > 0 && gastoTxt.trim();
    b.disabled = !listo;
    b.textContent = listo ? "Registrar gasto de " + $$(t) : "Escribí el monto y el concepto";
  }
}

async function cobrar() {
  if (!ticket.length || cobrando) return;
  cobrando = true;
  const id = D.nuevoId();                       // id propio: dos toques no cobran dos veces
  const venta = {
    dia: HOY(), ts: Date.now(), por: quien, pago, turno: (miFichaje() || {}).id || null,
    items: ticket.map(t => ({ n: t.n, p: t.p, c: t.c, bal: t.bal || 0, s: t.s })),
    total: suma(ticket, "p"), costo: suma(ticket, "c"),
  };
  const bajas = {};
  ticket.forEach(t => {
    if (!baldesItem(t) || !t.s || !t.s.length) return;
    const porSabor = baldesItem(t) / t.s.length;
    t.s.forEach(n => { const i = MENU.indexOf(n); if (i >= 0) bajas[i] = (bajas[i] || 0) + porSabor; });
  });
  try {
    await D.guardar("ventas", id, venta);
    for (const i of Object.keys(bajas)) await reponer(+i, -bajas[i], true);
    ultimaVenta = { id, bajas };
    ticket = []; pago = "Efectivo"; cerrarHoja(); pintar();
    notificar("Venta de " + $$(venta.total) + " registrada", "Deshacer", deshacer);
  } catch (e) { fallo(e); }
  cobrando = false;
  pintarHoja();
}
async function deshacer() {
  if (!ultimaVenta) return;
  const { id, bajas } = ultimaVenta; ultimaVenta = null;
  try {
    await D.borrar("ventas", id);
    for (const i of Object.keys(bajas)) await reponer(+i, bajas[i], true);
    notificar("Venta anulada");
  } catch (e) { fallo(e); }
}
async function registrarGasto() {
  const monto = cent(teclado || "0");
  if (!(monto > 0) || !gastoTxt.trim() || guardandoGasto) return;
  guardandoGasto = true;
  const caja = gastoRubro === "Retiro" ? true : gastoCaja;
  try {
    await D.guardar("gastos", D.nuevoId(), { dia: HOY(), ts: Date.now(), por: quien, concepto: gastoTxt.trim(), rubro: gastoRubro, monto, caja });
    teclado = ""; gastoTxt = ""; gastoCaja = true; cerrarHoja(); pintar();
    notificar((gastoRubro === "Retiro" ? "Retiro de " : "Gasto de ") + $$(monto) + " registrado");
  } catch (e) { fallo(e); }
  guardandoGasto = false;
}
async function anular(t, id) {
  try { await D.borrar(t === "v" ? "ventas" : "gastos", id); notificar("Movimiento anulado"); }
  catch (e) { fallo(e); }
}
async function reponer(i, n, callado) {
  // Si a un sabor nunca se le cargó stock, no hay nada que descontar.
  if (n < 0 && !cargado(i)) return;
  const id = "s" + i;
  // Seguir un sabor empieza al cargarle baldes; desde ahí el semáforo lo vigila aunque llegue a cero.
  const activo = true;
  try {
    // Quien no es dueño solo toca "baldes" (las reglas no le dejan cambiar nada más).
    if (D.sumar) await D.sumar("sabores", id, "baldes", n, esDueno() ? { nombre: MENU[i], ord: i, activo } : undefined);
    else await D.guardar("sabores", id, { nombre: MENU[i], baldes: Math.max(0, baldes(i) + n), ord: i, activo });
    if (!callado) pintar();
  } catch (e) { if (!callado) fallo(e); }
}

async function agregarInsumo() {
  const v = ($("#ins") || {}).value?.trim(); if (!v) return;
  try { await D.guardar("faltantes", D.nuevoId(), { nombre: v.slice(0, 80), por: quien, ts: Date.now() }); $("#ins").value = ""; pintar(); }
  catch (e) { fallo(e); }
}
function pintarDif() {
  const c = cent($("#contado").value), e = efectivoEsperado(dia), d = c - e;
  $("#dif").innerHTML = $("#contado").value === "" ? "" :
    d === 0 ? `<b class="pos">Cuadra perfecto.</b>`
    : `<b class="${d < 0 ? "neg" : "pos"}">${d < 0 ? "Faltan" : "Sobran"} ${$$(Math.abs(d))}.</b> Anotá abajo por qué, si lo sabés.`;
}
async function cerrarDia() {
  const campo = $("#contado").value;
  if (campo === "") { notificar("Contá la caja y escribí cuánto hay"); return; }
  if (cerrandoDia || cierreDe(dia)) { notificar("Este día ya está cerrado"); return; }
  cerrandoDia = true; setTimeout(() => { cerrandoDia = false; }, 4000);
  const contado = cent(campo), esperado = efectivoEsperado(dia);
  try {
    await D.guardar("cierres", "c_" + dia, { dia, ts: Date.now(), por: quien, esperado, contado, dif: contado - esperado, nota: $("#nota").value.trim() });
    notificar("Día cerrado"); pintar();
  } catch (e) { fallo(e); }
}
// Carga (o recarga) el menú real con sus precios. Borra los productos de prueba viejos (p0_…, p1_…).
async function cargarMenuReal(viejos, conStock) {
  MENU_REAL.forEach(([id, linea, nombre, precio, mx = 0, litros = 0], k) =>
    D.guardar("productos", id, { nombre, linea, precio: precio * 100, costo: (P.find(x => x.id === id) || {}).costo || 0, mx, litros, kg: 0, ord: k }));
  (viejos || []).forEach(id => D.borrar("productos", id));
  if (conStock) MENU.forEach((n, i) => D.guardar("sabores", "s" + i, { nombre: n, baldes: 1, ord: i, activo: true }));
}
async function sembrar() {
  await cargarMenuReal(P.map(p => p.id).filter(id => /^p\d+_\d+$/.test(id)), false);
  notificar("Menú de Frigo Shop cargado con sus precios.");
  pintar();
}
/* Una sola vez: menú real + 1 balde de cada sabor para la prueba. En la nube se pregunta al
   SERVIDOR si ya se hizo (no al caché del celular), así nunca vuelve a pisar el stock. */
let migrando = false;
async function migrarMenu() {
  if (migrando || !D || !esDueno() || (window.FRIGO && window.FRIGO.sinMigrar)) return;   // sinMigrar: solo para pruebas
  migrando = true;
  try {
    let viejos;
    if (enNube()) {
      const bd = firebase.firestore();
      const cfg = await bd.doc("ajustes/cfg").get({ source: "server" });
      if (cfg.exists && (cfg.data().menu || 0) >= MENU_VERSION) return;
      const ps = await bd.collection("productos").get({ source: "server" });
      viejos = ps.docs.map(d => d.id).filter(id => /^p\d+_\d+$/.test(id));
    } else {
      if (+ajuste("menu", 0) >= MENU_VERSION) return;
      viejos = P.map(p => p.id).filter(id => /^p\d+_\d+$/.test(id));
    }
    await cargarMenuReal(viejos, true);
    await setAjuste("menu", MENU_VERSION);
    notificar("Cargué el menú y los precios de Frigo Shop, y 1 balde de cada sabor para la prueba.");
    pintar();
  } catch (e) { /* sin conexión o sin base todavía: se reintenta la próxima vez que abras */ }
  finally { migrando = false; }
}
async function agregarProd() {
  const n = $("#pn").value.trim(), p = cent($("#pp").value);
  if (!n || !(p >= 0)) { notificar("Escribí el nombre y el precio"); return; }
  try {
    await D.guardar("productos", D.nuevoId(), {
      nombre: n, linea: $("#pl").value, precio: p, costo: cent($("#pc").value),
      mx: Math.max(0, Math.min(6, parseInt($("#px").value) || 0)), kg: 0, ord: Date.now(),
      ...(($("#pk").value || "").startsWith("b:") ? { bochas: +$("#pk").value.slice(2) } : ($("#pk").value || "").startsWith("l:") ? { litros: +$("#pk").value.slice(2) } : {}),
    });
    ["pn","pp","pc","px","pk"].forEach(i => $("#" + i).value = "");
    notificar("Producto agregado");
  } catch (e) { fallo(e); }
}
function editarProd(id, campo, valor) {
  const n = num(valor);
  if (!(n >= 0)) { notificar("Ese número no sirve"); return; }
  D.guardar("productos", id, { [campo]: campo === "kg" ? n : cent(valor) })
    .then(() => notificar("Guardado")).catch(fallo);
}

/* ============================================================
   LLEVARSE LOS DATOS
   ============================================================ */
function csv(filas) {
  return filas.map(f => f.map(c => {
    const s = String(c ?? "");
    return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(";")).join("\n");
}
async function exportar(tipo) {
  if (D && D.traer) await cargarHistoria(correrDia(HOY(), -400));   // la planilla lleva más de un año
  let texto, nombre;
  if (tipo === "csv") {
    const filas = [["Fecha","Hora","Tipo","Detalle","Sabores","Rubro o pago","Quien","Monto","Costo"]];
    [...V].sort((a, b) => a.ts - b.ts).forEach(v => filas.push([
      v.dia, hora(v.ts), "Venta", (v.items || []).map(i => i.n).join(" + "),
      (v.items || []).flatMap(i => i.s || []).join(" / "), v.pago || "", v.por || "",
      pesos(v.total).toFixed(2).replace(".", ","), pesos(v.costo || 0).toFixed(2).replace(".", ","),
    ]));
    [...G].sort((a, b) => a.ts - b.ts).forEach(g => filas.push([
      g.dia, hora(g.ts), "Gasto", g.concepto, "", g.rubro || "", g.por || "",
      "-" + pesos(g.monto).toFixed(2).replace(".", ","), "",
    ]));
    texto = csv(filas); nombre = "frigo-movimientos-" + HOY() + ".csv";
  } else {
    texto = JSON.stringify({ app: "FRIGO", version: VERSION, fecha: new Date().toISOString(), productos: P, sabores: S, ventas: V, gastos: G, cierres: C, ajustes: AJ,
      fichajes: FI, viajes: VJ, pedidos: PD, faltantes: FA }, null, 1);
    nombre = "frigo-copia-" + HOY() + ".json";
  }
  ultimoArchivo = { nombre, texto };
  $("#salida").innerHTML = `<b>${tipo === "csv" ? "Planilla" : "Copia"} lista</b> · ${texto.length.toLocaleString("es-AR")} caracteres
    <button class="btn" onclick="copiar(this)">Copiar al portapapeles</button>
    <button class="btn ghost" onclick="bajarArchivo(this)">Descargar ${esc(nombre)}</button>
    <textarea id="exp" rows="4" readonly style="margin-top:8px">${esc(texto)}</textarea>`;
}
let ultimoArchivo = null;
// Dentro de Claude el navegador no deja bajar archivos solo: se pide permiso a la página.
async function bajarArchivo(b) {
  if (!ultimoArchivo) return;
  const { nombre, texto } = ultimoArchivo;
  try {
    if (window.claude && window.claude.use) {
      const bajada = await window.claude.use("downloads");
      if (bajada) { await bajada.save({ filename: nombre, data: texto }); b.textContent = "Guardado"; return; }
      throw new Error("sin permiso");
    }
    const url = URL.createObjectURL(new Blob([texto], { type: "text/plain;charset=utf-8" }));
    const a = document.createElement("a");
    a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    b.textContent = "Descargado";
  } catch (e) {
    b.textContent = "No se pudo descargar: copiá el texto de abajo";
  }
}
async function copiar(b) {
  const t = $("#exp").value;
  try { await navigator.clipboard.writeText(t); b.textContent = "Copiado"; setTimeout(() => b.textContent = "Copiar al portapapeles", 2000); }
  catch (e) { $("#exp").select(); b.textContent = "Tocá Copiar en el teclado"; }
}
async function importar() {
  let d;
  try { d = JSON.parse($("#imp").value); } catch (e) { notificar("Eso no es una copia válida"); return; }
  if (!d || d.app !== "FRIGO") { notificar("Esa copia no es de FRIGO"); return; }
  let n = 0;
  try {
    for (const col of COLS) for (const doc of (d[col] || [])) { await D.guardar(col, doc.id, doc); n++; }
    $("#imp").value = ""; notificar("Se restauraron " + n + " registros");
  } catch (e) { fallo(e); }
}

/* ============================================================
   PINTAR
   ============================================================ */
const VISTAS = { compras: vCompras, hoy: vHoy, mov: vMov, pedidos: vPedidos, faltan: vFaltan, mas: vMas, rep: vRep, cerrar: vCerrar, prod: vProd, datos: vDatos, personal: vPersonal, jornada: vJornada };
const PADRE = { compras: "faltan", rep: "mas", cerrar: "mas", prod: "mas", datos: "mas", personal: "mas", mov: "mas" };

function pintar() {
  if (!D) return;
  if (!diaElegido) dia = HOY();     // pasadas las 6 de la mañana, "Hoy" pasa solo al día nuevo

  $("#est").innerHTML = (D.modo === "local"
      ? `<b class="pt">En este celular</b>`
      : `<b class="${D.enVivo ? "pt" : "pa"}">${D.enVivo ? "En vivo" : "Sin conexión"}</b>`)
    + (D.pendientes ? `<span style="color:var(--yel)">${D.pendientes} sin subir</span>` : "")
    + (enNube() && yo ? `<button class="who" onclick="salirDeLaCuenta()">${esc(quien)} · salir</button>` : "");

  const cr = criticos();
  $("#pinF").hidden = !cr.length;
  $("#pinF").textContent = cr.length;
  const nvs = nuevos();
  $("#pinP").hidden = !nvs;
  $("#pinP").textContent = nvs;

  // No se repinta la pantalla mientras alguien escribe en un campo (el encabezado y los avisos sí).
  const foco = document.activeElement;
  if (foco && ["INPUT","TEXTAREA","SELECT"].includes(foco.tagName) && $("#app").contains(foco)) return;
  if (esCadete() && !["jornada"].includes(vista)) vista = "jornada";
  const atras = PADRE[vista];
  $("#app").innerHTML = (atras ? `<button class="lnk" onclick="ir('${atras}')">‹ Volver a Más</button>` : "") + (VISTAS[vista] || vHoy)();
  $("#pie").textContent = "FRIGO " + VERSION + " · control interno, no reemplaza a tu contador";
  document.querySelectorAll("nav button[data-v]").forEach(b => b.classList.toggle("on", b.dataset.v === (PADRE[vista] || vista)));
}
function ir(v) {
  // Cambiar de pantalla suelta el campo que tenía el cursor (en iPhone el toque no lo suelta solo).
  const foco = document.activeElement; if (foco && foco.blur && foco !== document.body) foco.blur();
  vista = v; window.scrollTo(0, 0); pintar();
  if (v === "compras") cargarHistoria(correrDia(HOY(), -DIAS_CONSUMO));
  if (v === "rep") cargarHistoria(correrDia(HOY(), -2 * (+ajuste("rango", 7))));   // el período y el anterior, para comparar
  else if (dia < correrDia(HOY(), -VIVO)) cargarHistoria(dia);
}
function moverDia(n) { const d = correrDia(dia, n); if (d <= HOY()) { elegirDia(d); } }
function elegirDia(d) { dia = d || HOY(); diaElegido = dia !== HOY(); if (dia < correrDia(HOY(), -VIVO)) cargarHistoria(dia); pintar(); }
function abrirHoja(t) { hojaTab = t; eligiendo = null; elegidos = []; precioPara = null; teclado = ""; pintarHoja(); }
function cerrarHoja() { hojaTab = null; eligiendo = null; elegidos = []; precioPara = null; $("#capa").hidden = true; }

let tToast = null;
function notificar(texto, accion, fn) {
  const t = $("#toast");
  t.innerHTML = `<span>${esc(texto)}</span>` + (accion ? `<button id="tb">${esc(accion)}</button>` : "");
  if (accion) $("#tb").onclick = () => { t.classList.remove("ver"); fn(); };
  t.classList.add("ver");
  clearTimeout(tToast);
  tToast = setTimeout(() => t.classList.remove("ver"), accion ? 5000 : 2400);
}
const avisosVistos = new Set();
function aviso(texto, accion, fn) {
  if (avisosVistos.has(texto)) return; avisosVistos.add(texto);
  const d = document.createElement("div");
  d.className = "aviso";
  d.innerHTML = `<span>${esc(texto)}</span>`;
  const b = document.createElement("button");
  b.textContent = accion || "Entendido";
  b.onclick = () => { d.remove(); if (fn) fn(); };
  d.appendChild(b);
  $("#avisos").appendChild(d);
}
// Para lo que no se deshace: una pregunta antes de borrar.
function seguro(pregunta, fn) { if (confirm(pregunta)) fn(); }
function fallo(e) {
  console.error(e);
  notificar(e && (e.code === "not_granted" || e.code === "permission-denied") ? "No tenés permiso para esto" : "No se pudo guardar. Probá de nuevo.");
}

/* ============================================================
   ARRANQUE
   ============================================================ */
const esIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const instalada = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;

let auth = null;
function pantallaIngreso(msg) {
  $("#nav").hidden = true;
  $("#app").innerHTML = `<h2>Entrar</h2>
    <p class="hint">Usá el usuario que te dio el dueño. Queda abierto: no vas a tener que entrar todos los días.</p>
    <label class="f" for="lu">Usuario</label>
    <input id="lu" autocapitalize="none" autocomplete="username" placeholder="Ej. caja1">
    <label class="f" for="lp">Clave</label>
    <input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')ingresar()">
    <button class="btn" onclick="ingresar()">Entrar</button>
    <p class="hint" id="lm">${esc(msg || "")}</p>`;
  $("#est").innerHTML = "";
}
function ingresar() {
  let correo = $("#lu").value.trim().toLowerCase();
  if (!correo) return;
  if (!correo.includes("@")) correo += "@frigo.app";
  $("#lm").textContent = "Entrando…";
  auth.signInWithEmailAndPassword(correo, $("#lp").value)
    .catch(() => { $("#lm").textContent = "Usuario o clave incorrectos"; });
}
function salirDeLaCuenta() {
  if (miFichaje() && !confirmarSalida) { notificar("Todavía no marcaste tu salida", "Marcar y salir", async () => { await salir(); auth.signOut(); }); return; }
  auth.signOut();
}
let confirmarSalida = false;

function pantallaInstalar() {
  $("#app").innerHTML = `<div class="pant">
    <h2 style="font-size:20px">Instalá FRIGO antes de usarla</h2>
    <p class="hint">Desde el navegador, el iPhone puede borrar las ventas que cargues sin señal. Instalada, no.</p>
    <ol>
      <li>Tocá <b>Compartir</b>, el cuadrado con la flecha hacia arriba.</li>
      <li>Elegí <b>Agregar a pantalla de inicio</b>.</li>
      <li>Dejá activado <b>Abrir como web app</b> y tocá <b>Agregar</b>.</li>
      <li>Abrí FRIGO desde el ícono nuevo.</li>
    </ol>
    <p class="hint">En iPhone esto solo funciona desde Safari.</p></div>`;
}

let escuchas = [];
/* Menú público: copia del menú SIN costos para la página de pedidos. Los clientes no pueden
   leer "productos" (ahí están los costos). La mantiene al día la app del dueño, sola. */
let menuPublicado = null, tMenu = null;
const canon = o => JSON.stringify(Object.keys(o).sort().map(k => [k, o[k]]));
function programarMenu() { if (enNube() && esDueno()) { clearTimeout(tMenu); tMenu = setTimeout(publicarMenu, 1500); } }
async function publicarMenu() {
  try {
    const bd = firebase.firestore();
    if (menuPublicado === null) {
      const s = await bd.collection("menu").get();
      menuPublicado = new Map(s.docs.map(d => [d.id, canon(d.data())]));
    }
    const quiere = new Map(P.filter(p => p.precio > 0).map(p => [p.id,
      { nombre: p.nombre, linea: p.linea || "", mx: p.mx || 0, precio: p.precio, ord: p.ord || 0 }]));
    for (const [id, d] of quiere) if (menuPublicado.get(id) !== canon(d)) {
      menuPublicado.set(id, canon(d)); bd.doc("menu/" + id).set(d).catch(fallo);
    }
    for (const id of [...menuPublicado.keys()]) if (!quiere.has(id)) {
      menuPublicado.delete(id); bd.doc("menu/" + id).delete().catch(fallo);
    }
  } catch (e) { menuPublicado = null; }
}
async function encender() {
  const destinos = { faltantes: x => FA = x, productos: x => { P = x; programarMenu(); }, sabores: x => S = x, ventas: x => { VL = x; V = unir(x, HV); }, gastos: x => { GL = x; G = unir(x, HG); },
                     cierres: x => C = x, ajustes: x => AJ = x, fichajes: x => FI = x, viajes: x => VJ = x, pedidos: x => { avisarPedidosNuevos(x); PD = x; } };
  // Cada uno escucha solo lo que le corresponde ver (las reglas de la nube rechazan el resto).
  escuchas.forEach(f => { try { f(); } catch (e) {} });
  P = []; S = []; V = []; G = []; C = []; AJ = []; FI = []; VJ = []; PD = []; FA = [];
  VL = []; GL = []; HV = []; HG = []; histDesde = null; pedidosVistos = null; menuPublicado = null;
  const mias = enNube() && esCadete() ? ["fichajes", "viajes"] : COLS;
  escuchas = mias.map(col => D.ver(col, datos => {
    destinos[col](datos.slice().sort((a, b) => (b.ts || b.entrada || 0) - (a.ts || a.entrada || 0) || (a.ord || 0) - (b.ord || 0)));
    if (col === "productos") P.sort((a, b) => (a.ord || 0) - (b.ord || 0));
    pintar();
  }));
  try { const ok = await navigator.storage?.persist?.();
    if (ok === false && D.modo === "local") aviso("El celular podría borrar los datos guardados sin señal. Hacé una copia seguido, desde Más › Datos."); } catch (e) {}
  // Reloj en vivo: mientras alguien esté fichado, el tiempo trabajado se actualiza solo.
  clearInterval(relojVivo);
  relojVivo = setInterval(() => {
    if (!enNube()) return;
    if ((adentro().length || miViaje()) && ["hoy", "personal", "jornada"].includes(vista)) pintar();
  }, 30000);
  // Si quedó un viaje abierto (se recargó la app), se retoma el registro.
  if (enNube() && puedeViajar() && miViaje()) seguir();
  $("#nav").hidden = esCadete();
  pintar();
  setTimeout(migrarMenu, 2500);
}

(async function arrancar() {
  if (esIOS() && !instalada() && !(window.claude && window.claude.use)) return pantallaInstalar();

  // 1) Nube propia: roles, control de horarios y datos compartidos entre celulares.
  if (hayNube()) {
    try {
      const v = "10.14.1", base = "https://www.gstatic.com/firebasejs/" + v + "/firebase-";
      try {
        await cargarScript(base + "app-compat.js");
        await Promise.all([cargarScript(base + "auth-compat.js"), cargarScript(base + "firestore-compat.js")]);
      } catch (e) {
        // Sin el motor de la nube no se sigue con una base aparte en este celular:
        // las ventas cargadas ahí nunca le llegarían al dueño.
        $("#app").innerHTML = `<p class="vacio">No se pudo conectar. Conectate a internet y tocá Reintentar, así lo que cargues no queda separado del resto del equipo.</p>
          <button class="btn" onclick="location.reload()">Reintentar</button>`;
        return;
      }
      firebase.initializeApp(window.FRIGO.firebase);
      auth = firebase.auth();
      await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
      const bd = firebase.firestore();
      D = depositoFirestore(auth, bd);
      await D.iniciar();
      auth.onAuthStateChanged(async u => {
        yo = u;
        pararSeguimiento();
        if (!u) { clearInterval(relojVivo); pantallaIngreso(); return; }
        const f = ficha(u.email);
        quien = f ? f.nombre : (u.email || "").split("@")[0];
        rol = f ? f.rol : "empleado";
        conGps = f ? !!f.gps : false;
        soloLectura = rol !== "dueño";
        if (!f) aviso("Tu usuario todavía no tiene rol asignado. Avisale al dueño.");
        vista = esCadete() ? "jornada" : "hoy";
        await encender();
      });
      return;
    } catch (e) {
      aviso("No se pudo conectar con la nube. La app sigue andando con los datos de este celular.");
    }
  }

  // 2) Dentro de Claude: base compartida del artefacto.
  try {
    if (window.claude && window.claude.use) {
      const bd = await window.claude.use("db");
      const usuario = await window.claude.use("user");
      if (!bd) { $("#app").innerHTML = `<p class="vacio">Abrí esta página con tu cuenta para usar FRIGO.</p>`; return; }
      D = depositoClaude(bd);
      soloLectura = usuario ? !(usuario.canEdit() ?? true) : false;
    } else {
      // 3) Sin nube: todo vive en este celular.
      D = depositoLocal();
    }
    await D.iniciar();
  } catch (e) {
    $("#app").innerHTML = `<p class="vacio">No se pudo abrir la base de datos de este celular. Probá cerrar y volver a abrir la app.</p>`;
    return;
  }
  await encender();
})();

/* Actualización automática.
   La versión nueva se activa sola y la app se recarga en cuanto no haya nada a medio hacer
   (hoja abierta, ticket, gasto, viaje en curso o algo escrito sin guardar). Nadie toca nada. */
if ("serviceWorker" in navigator) {
  const habiaControlador = !!navigator.serviceWorker.controller;   // primera instalación: no hace falta recargar
  const sinGuardar = () => [...document.querySelectorAll("input, textarea")].some(x =>
    !["date", "hidden", "checkbox", "radio", "button"].includes(x.type) && !x.readOnly && x.value !== x.defaultValue);
  const ocupado = () => !!(!$("#capa").hidden || ticket.length || teclado || gastoTxt || vigia !== null || sinGuardar());
  let pendiente = false, yendo = false;
  const intentar = () => {
    if (!pendiente || yendo || ocupado()) return;
    yendo = true;
    if (document.visibilityState === "visible") { notificar("Actualizando FRIGO…"); setTimeout(() => location.reload(), 900); }
    else location.reload();
  };
  setInterval(intentar, 4000);
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (habiaControlador) { pendiente = true; intentar(); } });
  addEventListener("load", async () => {
    try {
      const reg = await navigator.serviceWorker.register("sw.js", { updateViaCache: "none" });
      const activar = w => { if (w) w.postMessage({ type: "SKIP_WAITING" }); };
      activar(reg.waiting);
      reg.addEventListener("updatefound", () => {
        const w = reg.installing;
        w && w.addEventListener("statechange", () => { if (w.state === "installed") activar(w); });
      });
      const buscar = () => reg.update().catch(() => {});
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") buscar(); });
      addEventListener("online", buscar);
      setInterval(buscar, 15 * 60 * 1000);
    } catch (e) {}
  });
}
